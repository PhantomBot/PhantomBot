name: Build JLink Binaries

on:
  workflow_dispatch:

jobs:
  resolve-runners:
    name: Resolve Ubuntu ARM Runner
    runs-on: ubuntu-latest
    outputs:
      arm64-os: ${{ steps.get-os.outputs.arm64-os }}
    steps:
      - id: get-os
        run: |
          . /etc/os-release
          echo "arm64-os=ubuntu-${VERSION_ID}-arm" >> "$GITHUB_OUTPUT"

  updatejlink:
    name: Update JLink Builds
    needs: resolve-runners
    strategy:
      matrix:
        include:
          - osname: Linux (GCC, x86_64)
            java-version: 17
            java-distribution: 'temurin'
            folder: java-runtime-linux
            qemu: false
            os: ubuntu-latest
            script: jlink-jdk-linux.sh
          - osname: Linux (GCC, arm64)
            java-version: 17
            java-distribution: 'temurin'
            folder: java-runtime-arm64
            qemu: false
            os: ${{ needs.resolve-runners.outputs.arm64-os }}
            script: jlink-jdk-linux.sh
          - osname: Linux (GCC, arm32)
            java-version: 17
            java-distribution: 'temurin'
            folder: java-runtime-arm32
            qemu: true
            platform: linux/arm/v7
            image: eclipse-temurin:17-jdk
            os: ubuntu-latest
            script: jlink-jdk-docker.sh
            jdk: /opt/java/openjdk
          - osname: Windows
            java-version: 17
            os: windows-latest
            java-distribution: 'temurin'
            folder: java-runtime
            qemu: false
            script: jlink-jdk.bat
          - osname: macOS
            java-version: 17
            java-distribution: 'temurin'
            folder: java-runtime-macos
            qemu: false
            os: macos-latest
            script: jlink-jdk-macos.sh
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
    - name: Set up QEMU
      if: matrix.qemu == true
      uses: docker/setup-qemu-action@v4
      with:
        platforms: ${{ matrix.platform }}
    - name: Set up JDK
      if: matrix.qemu == false
      id: setup-java
      uses: actions/setup-java@v6
      with:
        distribution: ${{ matrix.java-distribution }}
        java-version: ${{ matrix.java-version }}
        check-latest: true
    - name: Run JLink (Windows)
      if: matrix.os == 'windows-latest'
      env:
        FOLDER: ${{ matrix.folder }}
        SCRIPT: ${{ matrix.script }}
        JDK: ${{ steps.setup-java.outputs.path }}
      run: |
        cd development-resources
        cmd /C $env:SCRIPT
    - name: Run JLink (Non-Windows)
      if: matrix.os != 'windows-latest' && !matrix.qemu
      env:
        FOLDER: ${{ matrix.folder }}
        SCRIPT: ${{ matrix.script }}
        JDK: ${{ steps.setup-java.outputs.path }}
      run: |
        cd development-resources
        chmod +x $SCRIPT
        /bin/bash $SCRIPT
    - name: Run JLink (Docker)
      if: matrix.qemu == true
      env:
        FOLDER: ${{ matrix.folder }}
        SCRIPT: ${{ matrix.script }}
        JDK: ${{ matrix.jdk }}
        PLATFORM: ${{ matrix.platform }}
        IMAGE: ${{ matrix.image }}
      run: |
        cd development-resources
        chmod +x $SCRIPT
        /bin/bash $SCRIPT
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.folder }}
        path: resources/${{ matrix.folder }}/**
        if-no-files-found: error
        retention-days: 1

  commit:
    name: Commit Binaries
    runs-on: ubuntu-latest
    needs: updatejlink
    steps:
    - name: Create GitHub App Token
      uses: actions/create-github-app-token@v3
      id: app-token
      with:
        client-id: ${{ secrets.BOT_CLIENT_ID }}
        private-key: ${{ secrets.BOT_PRIVATE_KEY }}
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        token: ${{ steps.app-token.outputs.token }}
    - name: Download Artifacts
      uses: actions/download-artifact@v8
      with:
        path: resources
    - name: Commit Changes
      uses: EndBug/add-and-commit@v11
      with:
        message: Updated the Java binaries
        default_author: github_actions
