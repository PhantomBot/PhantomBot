name: Auto-Retry Failed Jobs

run-name: "Auto-Retry Failed Jobs: ${{ github.event.workflow_run.name }} (#${{ github.event.workflow_run.run_number }}, attempt ${{ github.event.workflow_run.run_attempt }})"

on:
  workflow_run:
    workflows: ["Java CI", "Build JLink Binaries", "Build/Upload Release", "CodeQL", "On Push Actions"]
    types: [completed]

jobs:
  retry-failed-jobs:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    permissions:
      actions: write
    steps:
      - name: Trigger rerun for failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "Attempt ${{ github.event.workflow_run.run_attempt }} failed. Triggering retry for failed jobs in run $RUN_ID..."
          gh run rerun "$RUN_ID" --failed
  fail-failed-retry-jobs:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt >= 3 }}
    steps:
      - name: Fail for failed jobs
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          JOB_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          echo "Run $RUN_ID failed after 3 attempts... $JOB_URL"
          exit 1