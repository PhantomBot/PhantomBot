<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>PhantomBot | Log in</title>
        <!-- Bootstrap 3.3.7 -->
        <link rel="stylesheet" href="../vendors/bootstrap/css/bootstrap.min.css">
        <link rel="icon" href="../../favicon.ico" type="image/x-icon">
        <!-- Theme style -->
        <link rel="stylesheet" href="../vendors/adminlte/css/AdminLTE.dark.min.css">
        <link rel="stylesheet" href="../vendors/adminlte/css/skins/skin-purple.dark.min.css">
        <!-- Pace theme -->
        <link rel="stylesheet" href="../vendors/PACE/pace.min.css">
        <link rel="stylesheet" href="../vendors/select2/select2.dark.min.css">
        <!-- Google fonts -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700,300italic,400italic,600italic">
        <!-- Custom style for the body height -->
        <style>
            body {
                height: auto;
            }
            .login-box-body {
                background: #333;
            }
            .select2-container--default .select2-selection--single .select2-selection__rendered {
                line-height: inherit;
                color: #888;
            }
        </style>
    </head>

    <!-- Main body -->
    <body class="hold-transition login-page">
        <div class="login-box">
            <div class="login-logo">
                <a href="https://phantombot.github.io/PhantomBot"><b>Phantom</b>Bot</a>
            </div>

            <div class="login-box-body">
                <p class="login-box-msg">Log in to start your session<span id="remote-msg"><br/><br/>This version of the panel is entirely client-side.
                        <br/>Your credentials will only be transmitted directly to your bot.<br/>All storage is directly in your browser<span id="hasAltPanelVersion"></span></span></p>

                <div class="alert-error text-center hide" id="error-box"></div>
                <div class="alert-success text-center hide" id="success-box"></div>
                <div class="alert-info text-center hide" id="info-box"></div>
                <br id="alert-br" class="hide" />

                <form id="loginform" autocomplete="on">
                    <div id="remote-fields">
                        <div class="form-group">
                            <input type="text" id="hostname" name="hostname" class="form-control" placeholder="Bot IP or Hostname">
                        </div>

                        <div class="form-group">
                            <input type="text" id="port" name="port" class="form-control" placeholder="Bot Port">
                        </div>
                    </div>

                    <div class="form-group">
                        <input type="text" id="username" name="username" class="form-control" autocomplete="username webauthn" placeholder="Username">
                    </div>

                    <div class="form-group">
                        <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" placeholder="Password">
                    </div>

                    <div class="form-group">
                        Remember me:
                        <select class="form-control select2 select2-hidden-accessible" id="remember" aria-hidden="true">
                            <option selected value="tab">Until I Close the Tab</option>
                            <option selected value="session">Until I Close the Browser Window</option>
                            <option value="4">4 hours</option>
                            <option value="12">12 hours</option>
                            <option value="24">24 hours</option>
                            <option value="48">2 days</option>
                            <option value="168">7 days</option>
                            <option value="336">14 days</option>
                            <option value="forever">Until I Click "Sign Out" On The Panel (Forever)</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-xs-4 pull-right">
                            <input type="submit" id="login-button" class="btn btn-primary btn-block btn-flat" value="Login">
                        </div>
                    </div>

                    <div class="row hide" id="passkey-row" style="margin-top: 10px;">
                        <div class="col-xs-12">
                            <button type="button" id="passkey-button" class="btn btn-default btn-block btn-flat">Sign in with a passkey</button>
                        </div>
                    </div>

                    <div class="row hide" id="passkey-setup-row" style="margin-top: 10px;">
                        <div class="col-xs-12">
                            <button type="button" id="passkey-setup-button" class="btn btn-primary btn-block btn-flat">Set up a passkey</button>
                        </div>
                    </div>
                </form>
                <!-- this could link to a how-to reset the password guide -->
                <!-- <a href="#">Unable to login?</a><br> -->
            </div>
        </div>

        <!-- jQuery 3 -->
        <script src="../vendors/jquery/jquery.min.js"></script>
        <!-- Bootstrap 3.3.7 -->
        <script src="../vendors/bootstrap/js/bootstrap.min.js"></script>
        <script src="../vendors/PACE/pace.min.js"></script>
        <script src="../vendors/select2/select2.full.min.js"></script>
        <script src="../../common/reconnecting-websocket/reconnectingWS.min.js"></script>
        <!-- Crypto-JS -->
        <script src="../vendors/crypto-js/crypto-js-4.1.1.min.js"></script>
        <script src="/common/js/session.js"></script>
        <script src="/common/js/passkey.js"></script>
        <script>
            let isLocalBot = false;
            let allowPasskey = false;
            let hasAltPanelVersion = false;
            let authExpired = false;
            // The current request of startConditionalLogin(), or null when none is running
            let conditionalLogin = null;
            // A setup link carries its token after the #, so it is never sent to the bot with the page
            const setupToken = new URLSearchParams(window.location.hash.substring(1)).get('setup');
            // A setup link opened while this page is already showing only changes the part after the #, which does not load
            // the page again
            window.addEventListener('hashchange', function () {
                if (new URLSearchParams(window.location.hash.substring(1)).get('setup') !== setupToken) {
                    window.location.reload();
                }
            });

            let sslHelp = 'Either the bot is not responding or SSL, which is required, is not enabled on this bot.<br /><br />'
                    + 'Troubleshooting Steps:<br />'
                    + '• Ensure the bot is running<br />On Windows, the black window must not be closed (minimize is okay)<br />On Linux, do not close your SSH '
                    + 'connection unless you have started the bot as a daemon using <i>service</i> or <i>systemctl</i><br />'
                    + '• Try visiting the bots built-in webserver directly to see if you need to give your browser approval to use the self-signed '
                    + 'SSL certificate: <a href="https://%hostname%:%port%" target="bot">https://%hostname%:%port%</a><br />'
                    + '• If you are getting an SSL error that can not be bypassed, try shutting down the bot and deleting <i>selfkey.jks</i> in '
                    + 'the <i>config</i> folder<br /><br />'
                    + 'For further instructions on setting up SSL, please see '
                    + '<a href="https://phantombot.dev/guides/#guide=content/integrations/twitchembeds" target="guide">this guide</a>';

            function doKickback(isStable) {
                let params = new URLSearchParams(document.location.search.substring(1));

                let kickback = window.location.pathname + '../';
                if (params.get("kickback") !== null && params.get("kickback").length > 0) {
                    kickback = decodeURIComponent(params.get("kickback"));
                }

                if (!isLocalBot && hasAltPanelVersion && kickback.includes("/panel") && isStable){
                    let stable = kickback.includes("/panel-stable");
                    if (isStable && !stable) {
                        kickback = kickback.replace("/panel", "/panel-stable");
                    } else if (!isStable && stable) {
                        kickback = kickback.replace("/panel-stable", "/panel");
                    }
                }

                window.location = window.location.origin + kickback;
            }

            function doLogin(hostname, port, username, password, remember) {
                let webSocket = new WebSocket((window.location.protocol === 'https:' ? 'wss://' : 'ws://') + hostname + (port.length > 0 ? ':' + port : '') + '/ws/panel/login?target=' + hostname + (port.length > 0 ? ':' + port : ''));

                password = CryptoJS.SHA256(password).toString();
                webSocket.onopen = function () {
                    Pace.restart();

                    webSocket.send(JSON.stringify({
                        remote: true,
                        query: 'login',
                        params: {
                            type: 'Auth',
                            user: username,
                            pass: password
                        }
                    }));
                };

                webSocket.onmessage = function (e) {
                    let message = JSON.parse(e.data);

                    if (message.errors !== undefined) {
                        if (message.errors[0].status === '401') {
                            $('#error-box').removeClass('hide');
                            $('#alert-br').removeClass('hide');
                            $('#error-box').html('Invalid Login');
                            webSocket.close(1000);
                        } else {
                            $('#error-box').removeClass('hide');
                            $('#alert-br').removeClass('hide');
                            $('#error-box').html('An unexpected error occurred while attempting to login<br />' + message.errors[0].status + ' ' + message.errors[0].title + ':' + message.errors[0].detail);
                            webSocket.close(1000);
                        }
                    } else if (message.authtoken !== undefined) {
                        let webauth = message.authtoken;
                        webSocket.close(1000);
                        window.localStorage.setItem('bothostname', hostname);
                        window.localStorage.setItem('botport', port);
                        window.localStorage.setItem('remember', remember);
                        window.localStorage.setItem('isStable', message["build-type"] !== undefined && message["build-type"] === "stable");
                        if (remember !== 'tab' && remember !== 'session') {
                            window.localStorage.setItem('webauth', webauth);
                            if (remember !== 'forever') {
                                window.localStorage.setItem('expires', Date.now() + (parseInt(remember) * 3600000));
                            }
                            window.localStorage.setItem('b64', btoa(username + ':' + password));
                        } else {
                            window.localStorage.removeItem('webauth');
                            window.localStorage.removeItem('expires');
                            window.localStorage.removeItem('b64');
                        }
                        let age = '; Max-Age=300';
                        if (remember === 'session') {
                            age = '';
                        }
                        history.pushState({}, "PhantomBot | Log in | Success");
                        window.sessionStorage.setItem('webauth', webauth);
                        // A passkey login in this tab would otherwise still decide which user the panel loads
                        window.sessionStorage.removeItem('panelUser');
                        window.sessionStorage.setItem('cookie', 'panellogin=' + btoa(username + ':' + password) + (window.location.protocol === 'https:' ? '; Secure' : '') + '; SameSite=Lax; Path=/' + age);
                        document.cookie = window.sessionStorage.getItem('cookie');
                        if (isLocalBot) {
                            // End any passkey session, so the bot does not prefer it over this login
                            fetch('/panel/login/passkey/logout', {method: 'POST'}).finally(function () {
                                doKickback(window.localStorage.getItem('isStable'));
                            });
                        } else {
                            doKickback(window.localStorage.getItem('isStable'));
                        }
                    }
                };
            }

            /**
             * Enters the panel after the bot has started a passkey session
             *
             * The session lives in a cookie that scripts can not read, so only the username is kept
             *
             * @param {String} username The user who signed in
             */
            function finishPasskeyLogin(username) {
                window.logoutCookie();
                window.localStorage.setItem('bothostname', $('#hostname').val());
                window.localStorage.setItem('botport', $('#port').val());
                history.pushState({}, 'PhantomBot | Log in | Success');
                window.sessionStorage.setItem('webauth', 'session');
                window.sessionStorage.setItem('panelUser', username);
                doKickback(window.localStorage.getItem('isStable'));
            }

            /**
             * Sends a passkey chosen by the user to the bot, then enters the panel
             *
             * @param {Object} credential The values returned by window.passkey.get()
             * @return {Promise} Rejected if the sign-in failed or the bot could not be reached
             */
            function verifyPasskeyLogin(credential) {
                credential.remember = $('#remember').val();

                return fetch('/panel/login/passkey/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(credential)
                }).then(function (res) {
                    if (!res.ok) {
                        throw new Error('Passkey sign-in failed. Try again. If it fails again, the passkey may have been removed from the panel');
                    }

                    return res.json();
                }).then(function (res) {
                    finishPasskeyLogin(res.username);
                });
            }

            /**
             * Shows why a passkey sign-in failed
             *
             * @param {Error} e The error
             */
            function showPasskeyError(e) {
                $('#success-box').addClass('hide');
                $('#error-box').removeClass('hide');
                $('#alert-br').removeClass('hide');
                $('#error-box').text(e.message);
            }

            /**
             * Lists the passkeys of this address in the suggestions of the username field, so signing in does not need
             * the button
             */
            function startConditionalLogin() {
                let request = {controller: new AbortController(), ended: false};

                stopConditionalLogin();
                conditionalLogin = request;
                fetch('/panel/login/passkey/options', {method: 'POST', signal: request.controller.signal}).then(function (res) {
                    return res.json();
                }).then(function (options) {
                    request.asked = Date.now();
                    // A minute before the challenge expires, as checkConditionalLogin() runs every 30 seconds
                    request.refreshAt = request.asked + options.timeout - 60000;

                    return window.passkey.get(options, request.controller.signal).then(function (credential) {
                        return verifyPasskeyLogin(credential).catch(function (e) {
                            showPasskeyError(e);
                            if (conditionalLogin === request) {
                                startConditionalLogin();
                            }
                        });
                    });
                }).catch(function () {
                    // Aborted, ended by the browser, or the bot could not be reached. checkConditionalLogin() starts it
                    // again, unless the browser ended it within 10 seconds, which would only cause a loop
                    request.ended = true;
                    request.restart = request.asked === undefined || Date.now() - request.asked >= 10000;
                });
            }

            /**
             * Starts the request of startConditionalLogin() again if it ended or its challenge is about to expire
             *
             * Browsers keep the request open without a time limit, and timers do not run while a computer sleeps, so this
             * compares the clock every 30 seconds and when the page is shown or hidden
             *
             * @param {Event} e (Optional) The event it runs for; a pageshow event of a page restored from the browser's
             *                  history always starts the request again
             */
            function checkConditionalLogin(e) {
                if (conditionalLogin !== null && ((e !== undefined && e.persisted === true)
                        || (conditionalLogin.ended ? conditionalLogin.restart : Date.now() >= conditionalLogin.refreshAt))) {
                    startConditionalLogin();
                }
            }

            /**
             * Ends the request of startConditionalLogin(), as browsers allow only one passkey request at a time
             */
            function stopConditionalLogin() {
                if (conditionalLogin !== null) {
                    conditionalLogin.controller.abort();
                    conditionalLogin = null;
                }
            }

            /**
             * Signs in with a passkey that was added from the panel
             */
            function passkeyLogin() {
                let restartConditional = conditionalLogin !== null && (!conditionalLogin.ended || conditionalLogin.restart);

                stopConditionalLogin();
                $('#error-box').addClass('hide');
                $('#success-box').addClass('hide');
                $('#alert-br').addClass('hide');

                fetch('/panel/login/passkey/options', {method: 'POST'}).then(function (res) {
                    return res.json();
                }).then(function (options) {
                    return window.passkey.get(options);
                }).then(verifyPasskeyLogin).catch(function (e) {
                    showPasskeyError(e);
                    if (restartConditional) {
                        startConditionalLogin();
                    }
                });
            }

            /**
             * Reads the answer to a passkey request, which has an error message when it failed
             *
             * @param {Response} res The response
             * @return {Promise} The body of the response
             */
            function readPasskeyAnswer(res) {
                return res.json().then(function (body) {
                    if (!res.ok) {
                        throw new Error(body.error !== undefined ? body.error : 'Passkey setup failed');
                    }

                    return body;
                });
            }

            /**
             * Asks the bot for the options of the setup link
             *
             * @return {Promise} The options for navigator.credentials.create()
             */
            function fetchSetupOptions() {
                return fetch('/panel/login/passkey/setup/options', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({token: setupToken})
                }).then(readPasskeyAnswer);
            }

            /**
             * Checks the setup link as soon as the page opens, so a link that no longer works says so right away
             */
            function checkSetupLink() {
                fetchSetupOptions().then(function () {
                    $('#info-box').removeClass('hide').text('Click Set up a passkey to add a passkey with this link and sign in');
                    $('#alert-br').removeClass('hide');
                    $('#passkey-setup-row').removeClass('hide');
                    $('#passkey-setup-button').on('click', passkeySetup);
                }).catch(function (e) {
                    $('#error-box').removeClass('hide').text(e.message);
                    $('#alert-br').removeClass('hide');
                });
            }

            /**
             * Adds a passkey with a setup link, then enters the panel
             */
            function passkeySetup() {
                $('#error-box').addClass('hide');
                $('#success-box').addClass('hide');
                $('#info-box').addClass('hide');
                $('#alert-br').addClass('hide');

                fetchSetupOptions().then(function (options) {
                    return window.passkey.create(options);
                }).then(function (credential) {
                    credential.token = setupToken;
                    credential.remember = $('#remember').val();

                    return fetch('/panel/login/passkey/setup/verify', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(credential)
                    });
                }).then(readPasskeyAnswer).then(function (res) {
                    finishPasskeyLogin(res.username);
                }).catch(function (e) {
                    $('#error-box').removeClass('hide');
                    $('#alert-br').removeClass('hide');
                    $('#error-box').text(e.message);
                });
            }

            /**
             * Enters the panel without asking again if a passkey session is still active, such as in a new tab
             *
             * Only the panel is entered this way. The Bot Setup and OAuth pages open with a session of the main login
             * themselves, and send anyone else here
             */
            function resumePasskeySession() {
                let kickback = new URLSearchParams(document.location.search.substring(1)).get('kickback');

                if ((kickback !== null && kickback.length > 0 && !kickback.startsWith('/panel'))
                        || (window.sessionStorage.getItem('/panel/login#remember') !== null && parseInt(window.sessionStorage.getItem('/panel/login#remember')) >= Date.now())) {
                    return;
                }

                fetch('/panel/login/passkey/session').then(function (res) {
                    return res.json();
                }).then(function (res) {
                    if (res.authenticated === true) {
                        window.sessionStorage.setItem('/panel/login#remember', (Date.now() + 10000));
                        finishPasskeyLogin(res.username);
                    }
                }).catch(function () {
                    // No session, the login form is already showing
                });
            }

            function login() {
                $('#error-box').addClass('hide');
                $('#success-box').addClass('hide');
                $('#alert-br').addClass('hide');

                let hostname = $('#hostname').val();
                let port = $('#port').val();
                let username = $('#username').val();
                let password = $('#password').val();
                let remember = $('#remember').val();

                if (hostname === undefined || hostname.length === 0) {
                    $('#error-box').removeClass('hide');
                    $('#alert-br').removeClass('hide');
                    $('#error-box').html('Bot IP or Hostname Required');
                    return;
                }

                if (port === undefined || port.length === 0 || isNaN(parseInt(port)) || parseInt(port) < 1 || parseInt(port) > 65536) {
                    $('#error-box').removeClass('hide');
                    $('#alert-br').removeClass('hide');
                    $('#error-box').html('Valid Bot Port Required');
                    return;
                }

                if (username === undefined || username.length === 0) {
                    $('#error-box').removeClass('hide');
                    $('#alert-br').removeClass('hide');
                    $('#error-box').html('Username Required');
                    return;
                }

                if (password === undefined || password.length === 0) {
                    $('#error-box').removeClass('hide');
                    $('#alert-br').removeClass('hide');
                    $('#error-box').html('Password Required');
                    return;
                }

                if (isLocalBot) {
                    doLogin(hostname, port, username, password, remember);
                } else {
                    $.ajax(
                            {
                                type: 'GET',
                                url: 'https://' + hostname + (port.length > 0 ? ':' + port : '') + '/sslcheck',
                                crossDomain: true,
                                dataType: 'text',
                                success: function (sslStatus) {
                                    if (sslStatus === 'true') {
                                        doLogin(hostname, port, username, password, remember);
                                    } else {
                                        $('#error-box').removeClass('hide');
                                        $('#alert-br').removeClass('hide');
                                        $('#error-box').html(sslHelp.replaceAll('%hostname%', hostname).replaceAll('%port%', port));
                                    }
                                },
                                error: function () {
                                    $('#error-box').removeClass('hide');
                                    $('#alert-br').removeClass('hide');
                                    $('#error-box').html(sslHelp.replaceAll('%hostname%', hostname).replaceAll('%port%', port));
                                }
                            }
                    );
                }
            }

            $(document).ready(function () {
                $("#loginform").submit(function (event) {
                    login();
                    event.preventDefault();
                });

                let hash = window.location.hash.slice(1);
                let kvs = hash.split('&');
                let hashmap = [];
                let spl;

                for (let i = 0; i < kvs.length; i++) {
                    spl = kvs[i].split('=', 2);
                    hashmap[spl[0]] = spl[1];
                }

                if (hashmap['logoutSuccess'] !== undefined && hashmap['logoutSuccess'] === 'true') {
                    $('#success-box').removeClass('hide');
                    $('#alert-br').removeClass('hide');
                    $('#success-box').html('Successfully logged out');
                    window.localStorage.removeItem('webauth');
                    window.localStorage.removeItem('remember');
                    window.localStorage.removeItem('isStable');
                    window.localStorage.removeItem('expires');
                    window.localStorage.removeItem('b64');
                }

                if (hashmap['connectFail'] !== undefined && hashmap['connectFail'] === 'true') {
                    $('#error-box').removeClass('hide');
                    $('#alert-br').removeClass('hide');
                    $('#error-box').html('Timed out connecting to the bot');
                    window.localStorage.removeItem('webauth');
                    window.localStorage.removeItem('remember');
                    window.localStorage.removeItem('isStable');
                    window.localStorage.removeItem('expires');
                    window.localStorage.removeItem('b64');
                }

                if (hashmap['sslFail'] !== undefined && hashmap['sslFail'] === 'true') {
                    $('#error-box').removeClass('hide');
                    $('#alert-br').removeClass('hide');
                    $('#error-box').html(sslHelp.replaceAll('%hostname%', window.localStorage.getItem('bothostname')).replaceAll('%port%', window.localStorage.getItem('botport')));
                    window.localStorage.removeItem('webauth');
                    window.localStorage.removeItem('remember');
                    window.localStorage.removeItem('isStable');
                    window.localStorage.removeItem('expires');
                    window.localStorage.removeItem('b64');
                }

                if (hashmap['missingBot'] !== undefined && hashmap['missingBot'] === 'true') {
                    $('#error-box').removeClass('hide');
                    $('#alert-br').removeClass('hide');
                    $('#error-box').html('The selected bot hostname was missing from the panel login parameters, please login again');
                    window.localStorage.removeItem('webauth');
                    window.localStorage.removeItem('remember');
                    window.localStorage.removeItem('isStable');
                    window.localStorage.removeItem('expires');
                    window.localStorage.removeItem('b64');
                }

                if ((hashmap['missingAuth'] !== undefined && hashmap['missingAuth'] === 'true')) {
                    $('#error-box').removeClass('hide');
                    $('#alert-br').removeClass('hide');
                    $('#error-box').html('Your session has expired, please login again');
                }

                if (hashmap['bothostname'] !== undefined && hashmap['bothostname'].length > 0) {
                    window.localStorage.setItem('bothostname', hashmap['bothostname']);
                }

                if (hashmap['botport'] !== undefined && hashmap['botport'].length > 0 && !isNaN(parseInt(hashmap['botport']))
                        && parseInt(hashmap['botport']) >= 1 && parseInt(hashmap['botport']) <= 65536) {
                    window.localStorage.setItem('botport', hashmap['botport']);
                }

                if (window.localStorage.getItem('bothostname')) {
                    $('#hostname').val(window.localStorage.getItem('bothostname'));
                } else {
                    $('#hostname').val('localhost');
                }

                if (window.localStorage.getItem('botport')) {
                    $('#port').val(window.localStorage.getItem('botport'));
                } else {
                    $('#port').val('25000');
                }

                $('#remember').select2({
                    width: '100%'
                });

                let params = new URLSearchParams(document.location.search.substring(1));

                if (params.get("message") !== null && params.get("message").length > 0) {
                    $('#info-box').removeClass('hide');
                    $('#alert-br').removeClass('hide');
                    let lines = params.get("message").split('\n');
                    $('#info-box').empty();
                    for (let i = 0; i < lines.length; i++) {
                        if (i > 0) $('#info-box').append($('<br/>'));
                        $('#info-box').append(document.createTextNode(lines[i]));
                    }
                }

                function checkAlreadyLoggedIn() {
                    if (window.localStorage.getItem('webauth') && window.localStorage.getItem('bothostname') && window.localStorage.getItem('botport')) {
                        if (window.localStorage.getItem('remember') !== 'forever') {
                            if (window.localStorage.getItem('remember') !== 'tab' && window.localStorage.getItem('remember') !== 'session'
                              && window.localStorage.getItem('expires') && window.localStorage.getItem('expires') > Date.now()
                              && (window.sessionStorage.getItem('/panel/login#remember') === null || parseInt(window.sessionStorage.getItem('/panel/login#remember')) < Date.now())) {
                                window.sessionStorage.setItem('/panel/login#remember', (Date.now() + 10000));
                                window.sessionStorage.setItem('webauth', window.localStorage.getItem('webauth'));
                                window.sessionStorage.removeItem('panelUser');
                                window.sessionStorage.setItem('cookie', 'panellogin=' + window.localStorage.getItem('b64') + (window.location.protocol === 'https:' ? '; Secure' : '') + '; SameSite=Lax; Path=/; Max-Age=300');
                                history.pushState({}, "PhantomBot | Log in | Success");
                                document.cookie = window.sessionStorage.getItem('cookie');
                                doKickback(window.localStorage.getItem('isStable'));
                            } else {
                                if (window.sessionStorage.getItem('/panel/login#remember') !== null && parseInt(window.sessionStorage.getItem('/panel/login#remember')) >= Date.now()) {
                                    $('#error-box').removeClass('hide');
                                    $('#alert-br').removeClass('hide');
                                    $('#error-box').html('Detected infinite <i>Remember Me</i> loop. You are now logged out');
                                }
                                window.localStorage.removeItem('webauth');
                                window.localStorage.removeItem('remember');
                                window.localStorage.removeItem('isStable');
                                window.localStorage.removeItem('expires');
                                window.localStorage.removeItem('b64');
                                window.sessionStorage.removeItem('/panel/login#remember');
                                authExpired = true;
                            }
                        }
                    }
                }

                let p1 = new Promise((resolve) => {
                    $.ajax(
                        {
                            type: 'GET',
                            url: window.location.protocol + '//' + window.location.hostname + (window.location.port.length > 0 ? ':' + window.location.port : '') + '/presence',
                            dataType: 'text',
                            success: function (presence) {
                                if (presence === 'PBok') {
                                    isLocalBot = true;
                                    $('#remote-msg').addClass('hide');
                                    $('#remote-fields').addClass('hide');
                                    $('#hostname').val(window.location.hostname);
                                    $('#port').val((window.location.port.length > 0 ? window.location.port : (window.location.protocol === 'https:' ? '443' : '80')));
                                }
                            },
                            complete: function() {
                                resolve();
                            }
                        }
                    );
                });

                let p2 = new Promise((resolve) => {$.ajax(
                        {
                            type: 'HEAD',
                            url: window.location.origin + (window.location.pathname.includes('/panel-stable') ? window.location.pathname.replace('/panel-stable', '/panel') : window.location.pathname.replace('/panel', '/panel-stable')),
                            success: function () {
                                hasAltPanelVersion = true;
                                $('#hasAltPanelVersion').html('<br/><br/>This login page is for the <b>'
                                    + (window.location.pathname.includes('/panel-stable') ? 'stable' : 'nightly')
                                    + '</b> version of the bot. Click <a href="'
                                    + (window.location.pathname.includes('/panel-stable') ? window.location.toString().replace('/panel-stable', '/panel') : window.location.toString().replace('/panel', '/panel-stable'))
                                    + '" target="_self">here</a> to switch to '
                                    + (window.location.pathname.includes('/panel-stable') ? 'nightly' : 'stable'));
                            },
                            complete: function() {
                                resolve();
                            }
                        }
                    );
                });

                let p3 = new Promise((resolve) => {
                    $.ajax(
                        {
                            type: 'GET',
                            url: window.location.protocol + '//' + window.location.hostname + (window.location.port.length > 0 ? ':' + window.location.port : '') + '/passkeycheck',
                            dataType: 'text',
                            success: function (allowed) {
                                if (allowed === 'true') {
                                    allowPasskey = true;
                                }
                            },
                            complete: function() {
                                resolve();
                            }
                        }
                    );
                });

                Promise.all([p1, p2, p3]).then(() => {
                    let canUsePasskeys = isLocalBot && allowPasskey && window.passkey !== undefined && window.passkey.isSupported();

                    // Someone opening a setup link is not sent on as the user who is already signed in, and is only
                    // offered to set up the passkey
                    if (setupToken !== null) {
                        if (canUsePasskeys) {
                            $('#username, #password').closest('.form-group').addClass('hide');
                            $('#login-button').closest('.row').addClass('hide');
                            checkSetupLink();
                        } else {
                            // The link can not be used here, but a password the user was also given still can
                            $('#error-box').removeClass('hide').text('This browser can not use passkeys on this address. Open the link on the bot\'s own address, '
                                    + 'with HTTPS and a trusted certificate, or on http://localhost');
                            $('#alert-br').removeClass('hide');
                        }
                    } else {
                        checkAlreadyLoggedIn();
                    }
                    if (isLocalBot && allowPasskey && setupToken === null) {
                        resumePasskeySession();
                        if (window.passkey !== undefined && window.passkey.isSupported()) {
                            $('#passkey-row').removeClass('hide');
                            $('#passkey-button').on('click', passkeyLogin);
                            // A passkey.js cached from an older version does not have it
                            if (typeof window.passkey.isConditionalSupported === 'function') {
                                window.passkey.isConditionalSupported().then(function (supported) {
                                    if (supported) {
                                        startConditionalLogin();
                                        setInterval(checkConditionalLogin, 30000);
                                        document.addEventListener('visibilitychange', checkConditionalLogin);
                                        window.addEventListener('pageshow', checkConditionalLogin);
                                    }
                                });
                            }
                        }
                    }
                    if (authExpired) {
                        $('#error-box').removeClass('hide');
                        $('#alert-br').removeClass('hide');
                        $('#error-box').html('Your session has expired, please login again');
                    }
                    if (!navigator.cookieEnabled) {
                        $('#error-box').removeClass('hide');
                        $('#alert-br').removeClass('hide');
                        $('#error-box').html($('#error-box').html() + '<p>Warning: Cookies are disabled or blocked. Login may fail</p>');
                    }
                });
            });
        </script>
        <script>
            function doFix() {
                window.sessionStorage.setItem('/panel/login#fix', (Date.now() + 10000));
                let newURL = window.location.toString().replace(window.location.pathname, window.location.pathname + '/');
                document.body.innerHTML = 'Fixing the URL, click <a href="' + newURL + '" target="_self">here</a> if you didn\'t redirect automatically...';
                window.location.replace(newURL);
            }

            if (!window.location.pathname.endsWith('/')) {
                if (window.sessionStorage.getItem('/panel/login#fix') === null || parseInt(window.sessionStorage.getItem('/panel/login#fix')) < Date.now()) {
                    doFix();
                }
            }
        </script>
    </body>
</html>
